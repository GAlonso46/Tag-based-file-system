version: '3.8'

services:
  # Backend API
  backend:
    image: tagfs-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - tagfs-data:/app/tags_data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - tagfs-overlay
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Frontend React
  frontend:
    image: tagfs-frontend:latest
    ports:
      - "80:80"
    networks:
      - tagfs-overlay
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # CLI Interactive (acceso remoto)
  cli:
    image: tagfs-cli:latest
    networks:
      - tagfs-overlay
    volumes:
      # Montar una carpeta compartida para subir archivos
      - cli-files:/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://backend:8000
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    # Mantener el contenedor vivo
    stdin_open: true
    tty: true

networks:
  tagfs-overlay:
    driver: overlay
    attachable: true

volumes:
  tagfs-data:
    driver: local
  cli-files:
    driver: local
