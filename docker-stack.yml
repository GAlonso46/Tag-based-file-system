version: '3.8'

services:
  # Backend API - Se ejecutará en PC 1
  backend:
    image: tagfs-backend:latest
    ports:
      - "8000:8000"
    volumes:
      # Usar volumen compartido o NFS para datos
      - tagfs-data:/app/tags_data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - tagfs-overlay
    deploy:
      replicas: 2  # 2 réplicas para alta disponibilidad
      placement:
        constraints:
          - node.role == manager  # Solo en nodo manager (PC 1)
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React - Se ejecutará en PC 2
  frontend:
    image: tagfs-frontend:latest
    ports:
      - "80:80"
    networks:
      - tagfs-overlay
    deploy:
      replicas: 2  # 2 réplicas para balanceo de carga
      placement:
        constraints:
          - node.role == worker  # Solo en nodos worker (PC 2)
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  tagfs-overlay:
    driver: overlay
    attachable: true

volumes:
  tagfs-data:
    driver: local
