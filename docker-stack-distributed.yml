version: '3.8'

services:
  # Backend API - Corre en el Manager (tu VM)
  backend:
    image: tagfs-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - tagfs-data:/app/tags_data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - tagfs-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager  # Solo en el nodo manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Frontend React - Corre en el Worker (PC de tu compañera)
  frontend:
    image: tagfs-frontend:latest
    ports:
      - "80:80"
    networks:
      - tagfs-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker  # Solo en nodos workers
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  tagfs-overlay:
    driver: overlay
    attachable: true

volumes:
  tagfs-data:
    driver: local
