version: '3.8'

services:
  # Metadata Database (PostgreSQL)
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tagfs
      POSTGRES_USER: tagfs_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tagfs-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagfs_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API - Corre en el Manager (tu VM)
  backend:
    image: tagfs-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - tagfs-data:/app/tags_data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://tagfs_user:${DB_PASSWORD:-changeme}@database:5432/tagfs
    networks:
      - tagfs-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager  # Solo en el nodo manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Frontend React - Corre en el Worker (PC de tu compañera)
  frontend:
    image: tagfs-frontend:latest
    ports:
      - "80:80"
    networks:
      - tagfs-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker  # Solo en nodos workers
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  tagfs-overlay:
    driver: overlay
    attachable: true

volumes:
  # Volumen NFS compartido para archivos. Rellena NFS_SERVER_IP en el entorno antes de desplegar.
  tagfs-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER_IP},rw,nfsvers=4
      device: ":/srv/nfs/tagfs_data"

  # Volumen para datos de Postgres (puede apuntar a NFS o local según infra)
  postgres-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER_IP},rw,nfsvers=4
      device: ":/srv/nfs/postgres_data"
