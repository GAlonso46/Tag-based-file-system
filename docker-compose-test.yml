version: '3.8'

services:
  # PostgreSQL - Base de datos centralizada
  postgres:
    image: postgres:15-alpine
    container_name: tagfs-postgres
    environment:
      POSTGRES_USER: tagfs
      POSTGRES_PASSWORD: tagfs123
      POSTGRES_DB: tagfs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagfs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tagfs-network

  # Backend - 3 instancias para alta disponibilidad
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tagfs-backend-1
    environment:
      DATABASE_URL: postgresql://tagfs:tagfs123@postgres:5432/tagfs
      SECRET_KEY: super-secret-key-for-jwt-testing
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - shared_files:/app/tags_data/files
      - shared_meta:/app/tags_data
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tagfs-network
    restart: unless-stopped

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tagfs-backend-2
    environment:
      DATABASE_URL: postgresql://tagfs:tagfs123@postgres:5432/tagfs
      SECRET_KEY: super-secret-key-for-jwt-testing
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - shared_files:/app/tags_data/files
      - shared_meta:/app/tags_data
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tagfs-network
    restart: unless-stopped

  backend-3:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tagfs-backend-3
    environment:
      DATABASE_URL: postgresql://tagfs:tagfs123@postgres:5432/tagfs
      SECRET_KEY: super-secret-key-for-jwt-testing
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - shared_files:/app/tags_data/files
      - shared_meta:/app/tags_data
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tagfs-network
    restart: unless-stopped

  # Nginx - Load balancer para backends
  nginx:
    image: nginx:alpine
    container_name: tagfs-nginx
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - tagfs-network
    restart: unless-stopped

  # Frontend React - 2 instancias
  frontend-1:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: tagfs-frontend-1
    ports:
      - "3001:80"
    depends_on:
      - nginx
    networks:
      - tagfs-network
    restart: unless-stopped

  frontend-2:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: tagfs-frontend-2
    ports:
      - "3002:80"
    depends_on:
      - nginx
    networks:
      - tagfs-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  shared_files:
    driver: local
  shared_meta:
    driver: local

networks:
  tagfs-network:
    driver: bridge
